name: Build tablet app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tablet-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.6.0'

      - name: Check the Mapbox token is set
        env:
          MAPBOX_PUBLIC_TOKEN: ${{ secrets.MAPBOX_PUBLIC_TOKEN || vars.MAPBOX_PUBLIC_TOKEN }}
        run: |
          if [ -z "$MAPBOX_PUBLIC_TOKEN" ]; then
            echo "::warning::Add the GitHub secret MAPBOX_PUBLIC_TOKEN (your Mapbox pk. token): repo Settings > Secrets and variables > Actions. Building only to check the code; nothing will be published."
            echo "HAS_TOKEN=false" >> "$GITHUB_ENV"
          else
            echo "HAS_TOKEN=true" >> "$GITHUB_ENV"
          fi

      # The app's signing key is made once and kept in the Actions cache (not in the repo),
      # so each new version installs over the old one.
      - uses: actions/cache@v4
        with:
          path: ~/.busflow-signing
          key: busflow-signing-v1

      - name: Signing key
        run: |
          mkdir -p ~/.busflow-signing
          if [ ! -f ~/.busflow-signing/busflow.keystore ]; then
            openssl rand -hex 16 > ~/.busflow-signing/password
            keytool -genkeypair -keystore ~/.busflow-signing/busflow.keystore -alias busflow -keyalg RSA -keysize 2048 -validity 12000 \
              -storepass "$(cat ~/.busflow-signing/password)" -keypass "$(cat ~/.busflow-signing/password)" -dname "CN=YS Transportation"
          fi
          echo "BUSFLOW_KEYSTORE=$HOME/.busflow-signing/busflow.keystore" >> "$GITHUB_ENV"
          echo "::add-mask::$(cat ~/.busflow-signing/password)"
          echo "BUSFLOW_KEYSTORE_PASSWORD=$(cat ~/.busflow-signing/password)" >> "$GITHUB_ENV"

      - name: Build the app
        env:
          MAPBOX_PUBLIC_TOKEN: ${{ secrets.MAPBOX_PUBLIC_TOKEN || vars.MAPBOX_PUBLIC_TOKEN }}
          MAPBOX_DOWNLOADS_TOKEN: ${{ secrets.MAPBOX_DOWNLOADS_TOKEN }}
        run: gradle :app:assembleRelease --stacktrace --no-daemon

      - name: Name the file
        run: cp app/build/outputs/apk/release/app-release.apk busflow-tablet.apk

      # Setup QR for a factory-reset tablet: installs BusFlow as the tablet's owner (updates itself, locked to BusFlow)
      - name: Setup QR
        run: |
          SUM=$(keytool -exportcert -alias busflow -keystore "$BUSFLOW_KEYSTORE" -storepass "$BUSFLOW_KEYSTORE_PASSWORD" | openssl dgst -sha256 -binary | base64 | tr '+/' '-_' | tr -d '=')
          cat > provision.json <<JSON
          {
            "android.app.extra.PROVISIONING_DEVICE_ADMIN_COMPONENT_NAME": "com.ystransportation.busflow.tablet/com.ystransportation.busflow.tablet.AdminReceiver",
            "android.app.extra.PROVISIONING_DEVICE_ADMIN_PACKAGE_DOWNLOAD_LOCATION": "https://github.com/${{ github.repository }}/releases/download/tablet-latest/busflow-tablet.apk",
            "android.app.extra.PROVISIONING_DEVICE_ADMIN_SIGNATURE_CHECKSUM": "$SUM",
            "android.app.extra.PROVISIONING_LEAVE_ALL_SYSTEM_APPS_ENABLED": true,
            "android.app.extra.PROVISIONING_SKIP_ENCRYPTION": true
          }
          JSON
          python3 -m json.tool provision.json > /dev/null
          pip install --quiet "qrcode[pil]"
          python3 -c "import qrcode,json; qrcode.make(json.dumps(json.load(open('provision.json')),separators=(',',':')), box_size=8, border=4).save('tablet-setup-qr.png')"

      - uses: actions/upload-artifact@v5
        with:
          name: busflow-tablet
          path: busflow-tablet.apk

      - name: Publish as the latest download
        if: env.HAS_TOKEN == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="0.4.${{ github.run_number }}"
          gh release delete tablet-latest --yes --cleanup-tag || true
          gh release create tablet-latest busflow-tablet.apk tablet-setup-qr.png provision.json \
            --title "BusFlow Tablet $VERSION" \
            --notes "Install on the tablet: open https://github.com/${{ github.repository }}/releases/latest/download/busflow-tablet.apk" \
            --latest
